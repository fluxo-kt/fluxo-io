name: Validate Workflows

on:
  push:
    paths:
      - '.github/actions/**.yml'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/actions/**.yml'
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate local action metadata
        run: |
          ruby -e '
            require "yaml"
            Dir[".github/actions/*/action.yml"].sort.each do |path|
              action = YAML.load_file(path)
              abort("#{path}: missing name") unless action["name"].is_a?(String)
              abort("#{path}: missing runs") unless action["runs"].is_a?(Hash)
            end
          '

      - uses: ./.github/actions/actionlint
