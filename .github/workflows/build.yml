name: Build

on:
  pull_request:
  push:

permissions:
  contents: read
  # required for all workflows (CodeQL)
  security-events: write
  # required for workflows in private repositories (CodeQL)
  actions: read

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}
  #GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  IS_DEFAULT_REPO: ${{ github.repository == 'fluxo-kt/fluxo-io' }}
  IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildAndCheck:
    strategy:
      fail-fast: false
      # One job per target family, so each fits the 5-minute budget for a routine lane.
      # A Kotlin/Native target compiles and runs its tests only on its own host OS, and one
      # host per family keeps the slow Apple toolchains in parallel jobs.
      # `JVM` stays in every filter: fluxo-bcv-js 1.1.0 fails configuration without it.
      # Filtered builds skip `mergeDetektSarif` (fluxo-kmp-conf 0.15.1 fails to build its task
      # graph under KMP_TARGETS) and `klibApiCheck` (a filtered klib dump lacks the other targets,
      # so it always differs); the unfiltered `api` job checks every ABI and merges SARIF.
      matrix:
        include:
          - { shard: jvm, os: ubuntu-24.04, targets: COMMON_JVM, tasks: 'build koverLog' }
          - { shard: api, os: ubuntu-24.04, targets: '', tasks: 'apiCheck detektAll mergeDetektSarif' }
          - { shard: web, os: ubuntu-24.04, targets: 'JVM,COMMON_JS', tasks: 'allTests assemble -x jvmTest' }
          - { shard: linux, os: ubuntu-24.04, targets: 'JVM,LINUX,ANDROID_NATIVE', tasks: 'allTests assemble -x jvmTest' }
          - { shard: mingw, os: windows-2025, targets: 'JVM,MINGW', tasks: 'allTests assemble -x jvmTest' }
          - { shard: macos-ios, os: macos-15, targets: 'JVM,MACOS,IOS', tasks: 'allTests assemble -x jvmTest' }
          - { shard: tvos-watchos, os: macos-15, targets: 'JVM,TVOS,WATCHOS', tasks: 'allTests assemble -x jvmTest' }
          # JVM tests on the bytecode floor and on the newest LTS; the build itself stays on 21.
          - { shard: jdk17, os: ubuntu-24.04, targets: JVM, tasks: 'jvmTest', jdk: '17' }
          - { shard: jdk25, os: ubuntu-24.04, targets: JVM, tasks: 'jvmTest', jdk: '25' }

    name: 'Check ${{ matrix.shard }} (${{ matrix.os }})'
    timeout-minutes: 12
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false
      KMP_TARGETS: ${{ matrix.targets }}
      CODEQL_LANGUAGE: java-kotlin

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed before 21 so that 21 stays the default JAVA_HOME for Gradle itself.
      - name: Set up test JDK ${{ matrix.jdk }}
        if: matrix.jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Kotlin/Native toolchains (~1 GB per host) live in ~/.konan, which setup-gradle does not
      # cache; downloading them costs minutes per native job.
      - name: Cache Kotlin/Native toolchains
        if: matrix.shard != 'jvm' && matrix.shard != 'api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Setup Gradle with encrypted cache
        if: env.GRADLE_ENCRYPTION_KEY != ''
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.os == 'Windows' }} # super slow on Windows.
          cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ env.IS_DEFAULT_BRANCH != 'true' }}
          add-job-summary-as-pr-comment: never
          artifact-retention-days: 1
          validate-wrappers: true

      - name: Setup Gradle without encrypted cache
        if: env.GRADLE_ENCRYPTION_KEY == ''
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ runner.os == 'Windows' }} # super slow on Windows.
          cache-read-only: ${{ env.IS_DEFAULT_BRANCH != 'true' }}
          add-job-summary-as-pr-comment: never
          artifact-retention-days: 1
          validate-wrappers: true

      # TODO: If it's a "build(deps): ..." commit, then run the dependency review actions,
      #  amend the `dependencyGuardBaseline` and `kotlinUpgradeYarnLock` task results

      - name: Initialize CodeQL
        if: matrix.shard == 'jvm'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ env.CODEQL_LANGUAGE }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list with "+" to use these queries, and those in the config file.
          #
          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended, security-and-quality.

      - name: 'Build and check'
        id: check
        timeout-minutes: 10
        shell: bash
        env:
          TASKS: ${{ matrix.tasks }}
          TEST_JDK: ${{ matrix.jdk }}
        run: |
          read -r -a args <<< "$TASKS"
          if [ -n "$KMP_TARGETS" ]; then args+=(-x mergeDetektSarif -x klibApiCheck); fi
          # Gradle finds the test JDK through the variable setup-java exports for it.
          if [ -n "$TEST_JDK" ]; then
            args+=("-Pfluxo.testJdk=$TEST_JDK" "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${TEST_JDK}_X64")
          fi
          ./gradlew "${args[@]}" --continue --stacktrace --scan

      - name: Upload sarif report (Detekt)
        if: always() && matrix.shard == 'api'
          && (github.event_name == 'pull_request' || env.IS_DEFAULT_BRANCH == 'true')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/detekt-merged.sarif
          category: detekt

      - name: Upload sarif report (Lint)
        if: always() && matrix.shard == 'jvm'
          && (github.event_name == 'pull_request' || env.IS_DEFAULT_BRANCH == 'true')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/lint-merged.sarif
          category: lint

      - name: Upload test results to Codecov
        continue-on-error: true
        if: (success() && !cancelled())
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        env:
          OS: ${{ matrix.shard }}
          JAVA_VERSION: 21
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/build/test-results/*/TEST-*.xml'
          env_vars: OS,JAVA_VERSION
          flags: '${{ matrix.shard }}'
          name: 'codecov-${{ matrix.shard }}-21'
          fail_ci_if_error: false
          verbose: true

      - name: Upload code coverage to Codecov
        continue-on-error: true
        if: matrix.shard == 'jvm' && (success() || failure())
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          OS: ${{ matrix.shard }}
          JAVA_VERSION: 21
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover-merged-report.xml
          env_vars: OS,JAVA_VERSION
          flags: '${{ matrix.shard }}'
          name: 'codecov-${{ matrix.shard }}-21'
          fail_ci_if_error: false
          verbose: true

      - name: Upload the build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '${{ matrix.shard }}-build-report'
          path: |
            **/build/logs/
            **/build/reports/
            **/build/output/
            build/*-merged.*
            hs_err_pid*.log
          compression-level: 9

      - name: Perform CodeQL Analysis
        if: matrix.shard == 'jvm'
        timeout-minutes: 6
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          GITHUB_DEPENDENCY_GRAPH_ENABLED: false
        with:
          category: "/language:${{ env.CODEQL_LANGUAGE }}"

  publishSnapshot:
    needs: buildAndCheck
    runs-on: macos-15
    if: github.event_name == 'push'
      && github.repository == 'fluxo-kt/fluxo-io'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GITHUB_DEPENDENCY_GRAPH_ENABLED: false
      RELEASE: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          artifact-retention-days: 1
          validate-wrappers: true

      - name: Read project version
        id: project_version
        run: |
          version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$([[ "$version" == *-SNAPSHOT ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Prepare SNAPSHOT publication artifacts
        if: steps.project_version.outputs.is_snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace --scan

      - name: Collect SNAPSHOT attestation subjects
        id: snapshot_attestation_subjects
        if: steps.project_version.outputs.is_snapshot == 'true'
        uses: ./.github/actions/central-attestation-subjects
        with:
          project-version: ${{ steps.project_version.outputs.version }}
          require-signatures: true

      - name: Attest SNAPSHOT artifacts
        if: steps.project_version.outputs.is_snapshot == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.snapshot_attestation_subjects.outputs.checksums }}

      - name: Publish SNAPSHOT
        if: steps.project_version.outputs.is_snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace --scan
