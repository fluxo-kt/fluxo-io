name: Build

on:
  pull_request:
  push:

permissions:
  contents: read
  # required for all workflows (CodeQL)
  security-events: write
  # required for workflows in private repositories (CodeQL)
  actions: read

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}
  #GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  IS_DEFAULT_REPO: ${{ github.repository == 'fluxo-kt/fluxo-io' }}
  IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  # Gradle encrypts configuration-cache entries with this key; a stable key lets a later run read them.
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildAndCheck:
    strategy:
      fail-fast: false
      # Timeouts keep 8–15× headroom over the local build time, since a shared runner can be
      # ~15× slower (maintainer ruling; .github/AGENTS.md "CI headroom"). One job per target
      # family runs the slow toolchains in parallel.
      # A Kotlin/Native target compiles and runs its tests only on its own host OS, and one
      # host per family keeps the slow Apple toolchains in parallel jobs.
      # `JVM` stays in every filter: the adapters have no Android target, so a one-target filter
      # builds their `commonMain` as platform code, which rejects `@JvmName`/`@JvmStatic`.
      # Filtered builds skip `klibApiCheck` (a filtered klib dump lacks the other targets, so it
      # always differs); the unfiltered `api` job checks every ABI and merges SARIF.
      matrix:
        include:
          - { shard: jvm, os: ubuntu-24.04, targets: COMMON_JVM, tasks: 'build koverLog' }
          # CodeQL extracts Kotlin only from compiler runs it observes, so a compile restored from
          # cache leaves it nothing to analyse and fails the job. Its own shard compiles the JVM
          # and Android code uncached, which leaves the build cache to every other job.
          - { shard: codeql, os: ubuntu-24.04, targets: COMMON_JVM, tasks: 'jvmTestClasses compileAndroidMain --no-build-cache' }
          - { shard: api, os: ubuntu-24.04, targets: '', tasks: 'apiCheck detektAll mergeDetektSarif', konan: true, cache-writer: true }
          - { shard: web, os: ubuntu-24.04, targets: 'JVM,COMMON_JS', tasks: 'allTests assemble -x jvmTest' }
          - { shard: linux, os: ubuntu-24.04, targets: 'JVM,LINUX,ANDROID_NATIVE', tasks: 'allTests assemble -x jvmTest', konan: true }
          - { shard: mingw, os: windows-2025, targets: 'JVM,MINGW', tasks: 'allTests assemble -x jvmTest', konan: true, cache-writer: true }
          - { shard: macos, os: macos-15, targets: 'JVM,MACOS', tasks: 'allTests assemble -x jvmTest', konan: true }
          - { shard: ios, os: macos-15, targets: 'JVM,IOS', tasks: 'allTests assemble -x jvmTest', konan: true, cache-writer: true }
          - { shard: tvos, os: macos-15, targets: 'JVM,TVOS', tasks: 'allTests assemble -x jvmTest', konan: true }
          - { shard: watchos, os: macos-15, targets: 'JVM,WATCHOS', tasks: 'allTests assemble -x jvmTest', konan: true }
          # JVM tests on the bytecode floor and on the newest LTS; the build itself stays on 21.
          - { shard: jdk17, os: ubuntu-24.04, targets: JVM, tasks: 'jvmTest', jdk: '17' }
          - { shard: jdk25, os: ubuntu-24.04, targets: JVM, tasks: 'jvmTest', jdk: '25' }

    name: 'Check ${{ matrix.shard }} (${{ matrix.os }})'
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false
      KMP_TARGETS: ${{ matrix.targets }}
      CODEQL_LANGUAGE: java-kotlin

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed before 21 so that 21 stays the default JAVA_HOME for Gradle itself.
      - name: Set up test JDK ${{ matrix.jdk }}
        if: matrix.jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Kotlin/Native toolchains (~1 GB per host) live in ~/.konan, which setup-gradle does not
      # cache; downloading them costs minutes per native job. Restore and save are separate
      # steps so a failed or timed-out job still saves them: a cache saved only on success is
      # never saved while cold jobs keep timing out.
      # On Windows the toolchains and the Gradle home live on D: (the workspace drive), not in ~
      # on C:. Restoring konan to C: spent minutes extracting a download of seconds (Defender is
      # already off there). The Gradle home cache, once disabled on Windows as too slow (most
      # likely the same C: cost), moves there too: without it every job
      # resolved all dependencies cold before the first task.
      - name: Keep Kotlin/Native toolchains and the Gradle home on D
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "KONAN_DATA_DIR=${RUNNER_TEMP}\\konan" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=${RUNNER_TEMP}\\gradle-home" >> "$GITHUB_ENV"

      # The toolchains depend on the Kotlin version alone. Keying on the whole catalog made every
      # dependency bump re-download and re-commonize them (+1.5–2 min per native job).
      - name: Read Kotlin version
        id: kotlin
        if: matrix.konan
        shell: bash
        run: |
          version="$(awk -F ' *= *' '$1 == "kotlin" { gsub(/"/, "", $2); print $2; exit }' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Kotlin/Native toolchains
        id: konan
        if: matrix.konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KONAN_DATA_DIR || '~/.konan' }}
          key: konan-${{ runner.os }}-${{ matrix.shard }}-kotlin-${{ steps.kotlin.outputs.version }}

      # No `cache-encryption-key`: setup-gradle saves configuration-cache data only for a licensed
      # Develocity trial (`ProjectCacheStatus` in its vendored caching library); the next step
      # caches it instead.
      # One `cache-writer` job per runner OS saves the Gradle home; the others only read it and
      # fall back to that writer's entry. A writing job saves a new ~600 MB dependency entry
      # whenever its dependency set changes; one writer per shard overflows the 10 GB repository
      # quota, and GitHub then evicts the previous run's entries before any run reuses them.
      # A reader downloads the few dependencies the writer lacks.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ env.IS_DEFAULT_BRANCH != 'true' || !matrix.cache-writer }}
          add-job-summary-as-pr-comment: never
          artifact-retention-days: 1
          validate-wrappers: true

      # Per shard, saved every run: its configuration cache (a hit skips configuring, ~30 s) and
      # the local build cache, which a read-only job above would otherwise never keep. Restored
      # over the writer's Gradle home. An entry is reusable only while every Gradle-home file it
      # recorded comes back. A reader saves no Gradle home, so a recorded file the writer's home
      # lacks is gone every run and its entry never hits. Known kinds travel here: dependency
      # metadata (`.pom`, `.module`, ~6 MB) and the Develocity plugin jar (~20 MB), which the
      # writer's cache cleanup purges, and kotlin-stdlib, whose metadata jar (`-all`)
      # version depends on the target filter (2.2.21 JVM-only, 2.3.0 Linux, 2.4.20 unfiltered).
      # Another kind shows as the file named in a reader's "cannot be reused" line.
      # Gradle checks each entry against its real inputs, so a stale one costs only a recompute.
      - name: Gradle shard state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gradle/configuration-cache
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/build-cache-1
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/**/*.pom
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/**/*.module
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/com.gradle/develocity-gradle-plugin
            ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib
          key: gradle-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: gradle-shard-${{ matrix.shard }}-

      # A reader's configuration cache records the files it resolved while configuring; any the
      # writer's home lacks (lincheck, per-target atomicfu klibs, the commonizer) are gone next
      # run, and the entry misses. Configuring every target and task here, without running any,
      # puts them into the home this writer saves. Its own entry makes this a cache hit later.
      # No reader runs on Windows, so the Windows writer skips it.
      - name: Resolve every shard's configuration inputs
        if: matrix.cache-writer && env.IS_DEFAULT_BRANCH == 'true' && runner.os != 'Windows'
        shell: bash
        run: KMP_TARGETS='' ./gradlew build koverLog mergeDetektSarif --dry-run

      # TODO: If it's a "build(deps): ..." commit, then run the dependency review actions,
      #  amend the `dependencyGuardBaseline` and `kotlinUpgradeYarnLock` task results

      - name: Initialize CodeQL
        if: matrix.shard == 'codeql'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ env.CODEQL_LANGUAGE }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list with "+" to use these queries, and those in the config file.
          #
          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended, security-and-quality.

      # Bounds a hang only.
      - name: 'Build and check'
        id: check
        timeout-minutes: 30
        shell: bash
        env:
          TASKS: ${{ matrix.tasks }}
          TEST_JDK: ${{ matrix.jdk }}
        run: |
          read -r -a args <<< "$TASKS"
          if [ -n "$KMP_TARGETS" ]; then args+=(-x klibApiCheck); fi
          # Gradle finds the test JDK through the variable setup-java exports for it.
          if [ -n "$TEST_JDK" ]; then
            args+=("-Pfluxo.testJdk=$TEST_JDK" "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${TEST_JDK}_X64")
          fi
          ./gradlew "${args[@]}" --continue --stacktrace --scan 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          # A configuration-cache miss fails nothing yet costs every later run its configuration
          # time, so put Gradle's reason on the run page (.github/AGENTS.md says how to fix one).
          grep 'configuration cache cannot be reused' "$RUNNER_TEMP/gradle.log" \
            | sed 's/^/::warning title=Configuration cache miss::/' || true

      # Saved from the default branch only: other branches can read its caches, and each extra
      # ~1 GB copy pushes the repository past its cache quota. A cancelled job (superseded push)
      # may hold a half-downloaded toolchain, so it never saves; a failed or timed-out step does.
      - name: Save Kotlin/Native toolchains
        if: "!cancelled() && matrix.konan && steps.konan.outputs.cache-hit != 'true'
          && env.IS_DEFAULT_BRANCH == 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KONAN_DATA_DIR || '~/.konan' }}
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - name: Upload sarif report (Detekt)
        if: always() && matrix.shard == 'api'
          && (github.event_name == 'pull_request' || env.IS_DEFAULT_BRANCH == 'true')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/detekt-merged.sarif
          category: detekt

      # mergeLintSarif writes no file when no module produced a Lint report; under AGP 9's
      # Android-KMP plugin no Lint analysis task exists here.
      - name: Upload sarif report (Lint)
        if: always() && matrix.shard == 'jvm' && hashFiles('build/lint-merged.sarif') != ''
          && (github.event_name == 'pull_request' || env.IS_DEFAULT_BRANCH == 'true')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: build/lint-merged.sarif
          category: lint

      - name: Upload test results to Codecov
        continue-on-error: true
        if: (success() && !cancelled())
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        env:
          OS: ${{ matrix.shard }}
          JAVA_VERSION: 21
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/build/test-results/*/TEST-*.xml'
          env_vars: OS,JAVA_VERSION
          flags: '${{ matrix.shard }}'
          name: 'codecov-${{ matrix.shard }}-21'
          fail_ci_if_error: false
          verbose: true

      - name: Upload code coverage to Codecov
        continue-on-error: true
        if: matrix.shard == 'jvm' && (success() || failure())
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          OS: ${{ matrix.shard }}
          JAVA_VERSION: 21
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover-merged-report.xml
          env_vars: OS,JAVA_VERSION
          flags: '${{ matrix.shard }}'
          name: 'codecov-${{ matrix.shard }}-21'
          fail_ci_if_error: false
          verbose: true

      - name: Upload the build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '${{ matrix.shard }}-build-report'
          path: |
            **/build/logs/
            **/build/reports/
            **/build/output/
            build/*-merged.*
            hs_err_pid*.log
          compression-level: 9

      - name: Perform CodeQL Analysis
        if: matrix.shard == 'codeql'
        timeout-minutes: 6
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          GITHUB_DEPENDENCY_GRAPH_ENABLED: false
        with:
          category: "/language:${{ env.CODEQL_LANGUAGE }}"

  publishSnapshot:
    needs: buildAndCheck
    runs-on: macos-15
    if: github.event_name == 'push'
      && github.repository == 'fluxo-kt/fluxo-io'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GITHUB_DEPENDENCY_GRAPH_ENABLED: false
      RELEASE: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          artifact-retention-days: 1
          validate-wrappers: true

      - name: Read project version
        id: project_version
        run: |
          version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$([[ "$version" == *-SNAPSHOT ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Prepare SNAPSHOT publication artifacts
        if: steps.project_version.outputs.is_snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace --scan

      - name: Collect SNAPSHOT attestation subjects
        id: snapshot_attestation_subjects
        if: steps.project_version.outputs.is_snapshot == 'true'
        uses: ./.github/actions/central-attestation-subjects
        with:
          project-version: ${{ steps.project_version.outputs.version }}
          require-signatures: true

      - name: Attest SNAPSHOT artifacts
        if: steps.project_version.outputs.is_snapshot == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.snapshot_attestation_subjects.outputs.checksums }}

      - name: Publish SNAPSHOT
        if: steps.project_version.outputs.is_snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace --scan
