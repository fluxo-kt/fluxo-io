name: PR Cache Cleanup

on:
  pull_request:
    types: [ closed ]

permissions:
  actions: write
  contents: read

jobs:
  pr-clean-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        # Built into gh: the old gh-actions-cache extension had to download a binary, which the
        # egress block refused. --succeed-on-no-caches: a PR that saved no cache is not a failure.
        run: gh cache delete --all --ref "$BRANCH" --repo "$REPO" --succeed-on-no-caches
