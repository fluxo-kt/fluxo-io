name: Scorecard

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'

# The Scorecard webapp rejects results (HTTP 400 "workflow verification failed") when any
# write permission is granted at workflow level, so the top level stays read-only and the
# job asks for the two writes it needs: SARIF upload and the OIDC token for publishing.
permissions: read-all

jobs:
  scorecard:
    if: github.repository == 'fluxo-kt/fluxo-io'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
