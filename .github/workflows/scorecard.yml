name: Scorecard

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'

# The Scorecard webapp rejects results (HTTP 400 "workflow verification failed") when any
# write permission is granted at workflow level, so the top level stays read-only and the
# job asks for the two writes it needs: SARIF upload and the OIDC token for publishing.
permissions: read-all

jobs:
  scorecard:
    if: github.repository == 'fluxo-kt/fluxo-io'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
